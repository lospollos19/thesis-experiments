name: Bench — compilation cost

# Manual only. The job occupies the Orin for its whole duration and produces a figure
# that is needed once, not per push.
on:
  workflow_dispatch:
    inputs:
      reps:
        description: "Repetitions per (config, cache state)"
        default: "5"

# The Orin is a single runner. This serialises the bench against the CI GPU job.
# Note the limit: concurrency groups are per repository, so a job in the RQ1 repository
# can still contend for the device. That contention is why the table reports medians.
concurrency:
  group: orin-exclusive
  cancel-in-progress: false

jobs:
  compile-cost:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 30
    steps:
      - name: Clean workspace
        run: git clean -xdff 2>/dev/null || true

      - uses: actions/checkout@v4

      # Clocks first: a measurement taken while the governor is free to scale is not
      # comparable between repetitions. `sudo -n` so the job cannot hang on a password
      # prompt. The result is recorded and the job fails on it at the very end, after
      # the data has been produced and uploaded -- a round-trip to this device is
      # expensive enough that failing early and returning nothing is the worse outcome.
      - name: Lock the clocks
        run: |
          set -uo pipefail
          locked=true
          sudo -n nvpmodel -m 0 || { echo "::warning::nvpmodel -m 0 failed"; locked=false; }
          sudo -n jetson_clocks || { echo "::warning::jetson_clocks failed"; locked=false; }
          echo "--- nvpmodel -q"
          nvpmodel -q || echo "::warning::nvpmodel -q unavailable"
          echo "--- jetson_clocks --show (head)"
          sudo -n jetson_clocks --show 2>/dev/null | head -20 || true
          echo "CLOCKS_LOCKED=$locked" >> "$GITHUB_ENV"

      - name: Bootstrap Poetry
        run: |
          set -euo pipefail
          VENV="$HOME/.poetry-venv"
          if [ ! -x "$VENV/bin/poetry" ]; then
            if python3 -c "import ensurepip" 2>/dev/null; then
              python3 -m venv "$VENV"
            else
              python3 -m venv --without-pip "$VENV"
              curl -fsSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
              "$VENV/bin/python" /tmp/get-pip.py --quiet
            fi
            "$VENV/bin/python" -m pip install --quiet --upgrade pip
            "$VENV/bin/python" -m pip install --quiet poetry
          fi
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/poetry" --version

      - name: Install dependencies
        env:
          CUDA_ROOT: /usr/local/cuda
        run: |
          export PATH="/usr/local/cuda/bin:$PATH"
          poetry install --extras "headless gpu"

      # Same guard as the test job: without it a missing nvcc would degrade to NumPy and
      # the bench would time an import instead of a compilation.
      - name: Preflight — device and PyCUDA
        run: |
          set -euo pipefail
          export PATH="/usr/local/cuda/bin:$PATH"
          which nvcc
          nvcc --version
          poetry run python - <<'PY'
          import sys
          from motion_pipeline.processing.gpu_processor import GPUProcessor

          backend = GPUProcessor().backend
          print(f"backend = {backend}")
          if backend != "pycuda":
              sys.exit("GPUProcessor fell back to NumPy: nothing would be compiled")
          PY

      - name: Measure
        env:
          REPS: ${{ inputs.reps }}
          CUDA_ROOT: /usr/local/cuda
        run: |
          export PATH="/usr/local/cuda/bin:$PATH"
          bash bench/run_compile_cost.sh compile-cost.jsonl

      - name: Summarise
        run: |
          set -euo pipefail
          poetry run python bench/aggregate_compile_cost.py compile-cost.jsonl \
            | tee compile-cost-summary.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "Clocks locked: \`$CLOCKS_LOCKED\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compile-cost
          path: |
            compile-cost.jsonl
            compile-cost-summary.md

      # Deliberately last: the numbers exist and are uploaded, but they were taken on an
      # unlocked device and must not be read as comparable.
      - name: Fail if the clocks were not locked
        run: |
          if [ "$CLOCKS_LOCKED" != "true" ]; then
            echo "::error::clocks were not locked — the figures above are not comparable"
            exit 1
          fi
