[tool.poetry]
name = "motion-pipeline"
version = "0.1.0"
description = "GPU-accelerated motion detection pipeline — Master thesis prototype"
authors = ["Your Name"]
readme = "README.md"
packages = [{ include = "motion_pipeline", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
numpy = ">=1.26"
opencv-python-headless = { version = "^4.9", optional = true }
opencv-python = { version = "^4.9", optional = true }
# No upper bound: PyCUDA compiles against whatever CUDA toolkit is installed, so it
# must stay free to track new releases. The floor is 2026.1 because the Orin runs
# CUDA 13.2 and the 2024.1 series predates CUDA 13.
pycuda = { version = ">=2026.1", optional = true }

[tool.poetry.extras]
gpu = ["pycuda"]
headless = ["opencv-python-headless"]
gui = ["opencv-python"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
ruff = "^0.4"
mypy = "^1.10"
# The RTS tool under study. A dev dependency rather than an extra: it is inert unless
# --testmon is passed, and it has to be present in every environment that takes part in
# a selection measurement, including the two variant branches.
pytest-testmon = "^2.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA device and PyCUDA (skipped otherwise)",
    # Declares that a gpu-marked test launches no kernel by design, so its absence from
    # the traced map is expected rather than a tracer miss (R1, question 3). It narrows
    # a safety check, so it is a declaration to justify at the test, never a convenience:
    # the completeness report keeps counting these tests and fails if one does launch.
    "no_kernel_launch: gpu test that legitimately launches no kernel",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true   # cv2 / pycuda have no stubs in CI
warn_unused_ignores = true
warn_redundant_casts = true
